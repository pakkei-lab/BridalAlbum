:root{--ink:#151515;--muted:#707070;--line:#e9e9e9;--soft:#f5f5f5;--pin:#e34850;--star:#efaa00}
*{box-sizing:border-box}html{background:#fff}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}.app{max-width:900px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
h1{font-size:24px;line-height:1.2;margin:0 0 10px;font-weight:750;letter-spacing:-.45px}.summary{display:flex;gap:9px}.count{display:flex;align-items:center;gap:6px;background:var(--soft);border:0;border-radius:999px;padding:7px 11px;font-size:14px;font-weight:650;color:var(--ink);cursor:pointer}.count b{font-variant-numeric:tabular-nums}.count.active{background:#151515;color:#fff}.count:active{transform:scale(.97)}.tabs{display:flex;gap:8px;overflow:auto;padding:11px 16px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:89px;z-index:19;background:white}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #dedede;background:#fff;padding:9px 15px;border-radius:999px;white-space:nowrap;font-weight:650;color:#555}.tab.active{background:#151515;color:white;border-color:#151515}.meta{padding:12px 16px 2px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 12px calc(90px + env(safe-area-inset-bottom))}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}.photo-wrap{aspect-ratio:4/5;background:#f3f3f3;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo{width:100%;height:100%;object-fit:contain;display:block}.card-foot{display:flex;align-items:center;padding:8px 8px 9px;gap:6px}.serial{font-size:12px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.pick{width:38px;height:38px;border:0;border-radius:50%;background:#f4f4f4;display:grid;place-items:center;color:#777;font-size:20px;line-height:1;cursor:pointer}.pick.active.pin{background:#ffecee;color:var(--pin)}.pick.active.star{background:#fff4d5;color:var(--star)}.pick:active{transform:scale(.94)}.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-left:16px;padding-right:16px}.tabs{top:91px}}
</style>

const KEY='photoBookSelection.v1';
let category='Indoor';
let selectionFilter=null;
let saved={pins:[],stars:[]};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.pins)&&Array.isArray(v.stars))saved=v}catch(e){}
let pins=new Set(saved.pins),stars=new Set(saved.stars);
const grid=document.getElementById('grid'),meta=document.getElementById('meta');
function persist(){localStorage.setItem(KEY,JSON.stringify({pins:[...pins],stars:[...stars]}));updateCounts()}
function updateCounts(){document.getElementById('pinCount').textContent=pins.size;document.getElementById('starCount').textContent=stars.size}
function button(type,id){const active=(type==='pin'?pins:stars).has(id);const label=type==='pin'?'Like':'Favourite';return `<button class="pick ${type} ${active?'active':''}" data-action="${type}" data-id="${id}" aria-label="${label} ${id}" aria-pressed="${active}">${type==='pin'?'♥':'★'}</button>`}
function render(){const list=photos.filter(p=>p.category===category&&(!selectionFilter||(selectionFilter==='pin'?pins:stars).has(p.id)));const filterLabel=selectionFilter==='pin'?' liked':selectionFilter==='star'?' starred':'';meta.textContent=`${list.length}${filterLabel} photos · selections are saved on this device`;grid.innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo-wrap"><img class="photo" src="${p.file}" alt="${p.id}" loading="lazy" decoding="async"></div><div class="card-foot"><span class="serial">${p.id}</span>${button('pin',p.id)}${button('star',p.id)}</div></article>`).join(''):'<div class="empty">No photos in this category.</div>';window.scrollTo({top:0,behavior:'instant'})}

document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{selectionFilter=selectionFilter===b.dataset.filter?null:b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{const active=x.dataset.filter===selectionFilter;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});render()}));
grid.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const set=b.dataset.action==='pin'?pins:stars;set.has(b.dataset.id)?set.delete(b.dataset.id):set.add(b.dataset.id);b.classList.toggle('active',set.has(b.dataset.id));b.setAttribute('aria-pressed',set.has(b.dataset.id));persist()});
